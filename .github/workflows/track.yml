name: fare-tracking
on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours 06:00 UTC
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python ingest.py snapshot
      - run: |
          git config user.name "palier-bot"
          git config user.email "bot@palier"
          git add data/snapshots
          git commit -m "snapshot $(date +%F)" || echo "rien a committer"
          git push
